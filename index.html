<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreetPick — 3 คู่เด็ดประจำวัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #080808; --surface: #111111; --surface2: #181818;
    --border: #222222; --text: #f0f0f0; --muted: #555555; --muted2: #333333;
    --green: #00ff87; --yellow: #ffd166; --red: #ff6b6b;
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'Noto Sans Thai', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; padding-bottom: 3rem; }

  .header { padding: 1.5rem 1.5rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 0.5px solid var(--border); }
  .logo { font-family: var(--font-display); font-size: 2.2rem; letter-spacing: 4px; }
  .logo span { color: var(--green); }
  .live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }
  .dot { width: 7px; height: 7px; background: var(--green); border-radius: 50%; animation: blink 1.4s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .datebar { padding: 0.6rem 1.5rem; font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; }

  .picks { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 1.2rem; }

  /* CARD */
  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: 16px; overflow: hidden; animation: fadeup 0.4s ease both; }
  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.15s; }
  .card:nth-child(3) { animation-delay: 0.25s; }
  @keyframes fadeup { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  /* CARD TOP */
  .card-top { padding: 1rem 1.25rem 0.8rem; border-bottom: 0.5px solid var(--border); }
  .rank-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .rank { font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }

  /* VALUE SCORE - ใหญ่และชัด */
  .score-badge {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface2); border: 0.5px solid var(--border);
    border-radius: 10px; padding: 6px 12px;
  }
  .score-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .score-num { font-family: var(--font-display); font-size: 2rem; line-height: 1; letter-spacing: 1px; }
  .score-max { font-size: 11px; color: var(--muted); }

  .teams { font-family: var(--font-display); font-size: 1.6rem; letter-spacing: 1.5px; line-height: 1.1; margin-bottom: 4px; }
  .league { font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; }

  /* ODDS ROW */
  .odds-row { display: flex; gap: 6px; padding: 0.7rem 1.25rem; background: var(--surface2); border-bottom: 0.5px solid var(--border); }
  .odds-box { flex: 1; text-align: center; padding: 8px 4px; border: 0.5px solid var(--border); border-radius: 10px; }
  .odds-box.highlight { border-color: var(--green); background: rgba(0,255,135,0.05); }
  .odds-box-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .odds-box-val { font-size: 16px; font-weight: 700; }
  .odds-box.highlight .odds-box-val { color: var(--green); }

  /* BET SECTION */
  .bet-section { padding: 0.8rem 1.25rem; border-bottom: 0.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .bet-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
  .bet-pill { display: inline-block; background: rgba(0,255,135,0.1); border: 0.5px solid rgba(0,255,135,0.3); color: var(--green); font-size: 14px; font-weight: 700; padding: 5px 14px; border-radius: 20px; }
  .odds-target-wrap { text-align: right; }
  .odds-target-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; }
  .odds-target-num { font-family: var(--font-display); font-size: 2rem; color: var(--yellow); line-height: 1; }

  /* PROB BAR */
  .prob-section { padding: 0.7rem 1.25rem; border-bottom: 0.5px solid var(--border); }
  .prob-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .prob-bar-wrap { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-bottom: 8px; }
  .prob-seg { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
  .prob-labels { display: flex; justify-content: space-between; font-size: 12px; }
  .prob-item { display: flex; align-items: center; gap: 5px; }
  .prob-dot { width: 8px; height: 8px; border-radius: 50%; }
  .prob-pct { font-weight: 700; font-size: 14px; }
  .prob-name { color: var(--muted); font-size: 11px; }

  /* ANALYSIS */
  .card-foot { padding: 0.7rem 1.25rem; background: #0d0d0d; }
  .analysis { font-size: 13px; color: #999; line-height: 1.6; }

  /* STATE */
  .state { text-align: center; padding: 4rem 1.5rem; color: var(--muted); font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--green); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 1rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { margin-top: 2rem; padding: 1rem 1.5rem; text-align: center; font-size: 10px; color: var(--muted2); border-top: 0.5px solid var(--border); letter-spacing: 1px; }

  @media (max-width: 480px) {
    .teams { font-size: 1.3rem; }
    .score-num { font-size: 1.6rem; }
    .odds-target-num { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="logo">STREET<span>PICK</span></div>
  <div class="live-badge"><span class="dot"></span>LIVE ODDS</div>
</header>

<div class="datebar">
  <span id="date-label">—</span>
  <span id="updated-label">—</span>
</div>

<main class="picks" id="picks">
  <div class="state"><div class="spinner"></div>กำลังโหลดข้อมูล...</div>
</main>

<footer>วิเคราะห์จาก odds จริง • value score คำนวณจาก implied probability • ไม่ใช่คำแนะนำการเดิมพัน</footer>

<script>
function rankLabel(i) {
  return ['คู่เด็ด 1 🥇','คู่เด็ด 2 🥈','คู่เด็ด 3 🥉'][i] || 'คู่เด็ด ' + (i+1);
}
function formatTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', day: '2-digit', month: 'short' });
  } catch { return iso; }
}
function scoreColor(s) {
  if (s >= 45) return '#00ff87';
  if (s >= 30) return '#ffd166';
  return '#ff6b6b';
}
function highlightBox(p, type) {
  if (type === 'home' || p.bet.includes(p.home)) return 'home';
  if (type === 'away' || p.bet.includes(p.away)) return 'away';
  if (p.bet.includes('Over')) return 'over';
  return '';
}

async function load() {
  const container = document.getElementById('picks');
  try {
    const r = await fetch('picks.json?t=' + Date.now());
    if (!r.ok) throw new Error('โหลดไม่ได้');
    const data = await r.json();

    document.getElementById('date-label').textContent = data.date || '—';
    document.getElementById('updated-label').textContent = 'อัปเดต ' + formatTime(data.updated_at);

    if (!data.picks || data.picks.length === 0) {
      container.innerHTML = '<div class="state">ยังไม่มีข้อมูลวันนี้ รอได้เลย 08:00 น.</div>';
      return;
    }

    container.innerHTML = data.picks.map((p, i) => {
      const col = scoreColor(p.value_score || 0);
      const hw = p.home_win_pct || 0;
      const dp = p.draw_pct || 0;
      const aw = p.away_win_pct || 0;
      const isHome = p.bet && p.bet.includes(p.home);
      const isAway = p.bet && p.bet.includes(p.away);
      const isOver = p.bet && p.bet.includes('Over');

      return `
      <div class="card">
        <div class="card-top">
          <div class="rank-row">
            <span class="rank">${rankLabel(i)}</span>
            <div class="score-badge">
              <span class="score-label">VALUE</span>
              <span class="score-num" style="color:${col}">${p.value_score || 0}</span>
              <span class="score-max">/100</span>
            </div>
          </div>
          <div class="teams">${p.home} <span style="color:var(--muted);font-size:1rem">vs</span> ${p.away}</div>
          <div class="league">${p.league} · ${formatTime(p.commence)}</div>
        </div>

        <div class="odds-row">
          <div class="odds-box${isHome ? ' highlight' : ''}">
            <div class="odds-box-label">${p.home}</div>
            <div class="odds-box-val">${p.odds_home || '—'}</div>
          </div>
          <div class="odds-box">
            <div class="odds-box-label">เสมอ</div>
            <div class="odds-box-val">${p.odds_draw || '—'}</div>
          </div>
          <div class="odds-box${isAway ? ' highlight' : ''}">
            <div class="odds-box-label">${p.away}</div>
            <div class="odds-box-val">${p.odds_away || '—'}</div>
          </div>
          ${isOver ? `<div class="odds-box highlight"><div class="odds-box-label">Over 2.5</div><div class="odds-box-val">${p.odds_target || '—'}</div></div>` : ''}
        </div>

        <div class="bet-section">
          <div>
            <div class="bet-label">แนะนำ</div>
            <span class="bet-pill">${p.bet}</span>
          </div>
          <div class="odds-target-wrap">
            <div class="odds-target-label">Odds</div>
            <div class="odds-target-num">${p.odds_target || '—'}</div>
          </div>
        </div>

        <div class="prob-section">
          <div class="prob-title">โอกาสชนะ (implied prob)</div>
          <div class="prob-bar-wrap">
            <div class="prob-seg" style="width:${hw}%;background:#00ff87"></div>
            <div class="prob-seg" style="width:${dp}%;background:#ffd166"></div>
            <div class="prob-seg" style="width:${aw}%;background:#ff6b6b"></div>
          </div>
          <div class="prob-labels">
            <div class="prob-item">
              <span class="prob-dot" style="background:#00ff87"></span>
              <span class="prob-pct" style="color:#00ff87">${hw}%</span>
              <span class="prob-name">${p.home}</span>
            </div>
            <div class="prob-item">
              <span class="prob-dot" style="background:#ffd166"></span>
              <span class="prob-pct" style="color:#ffd166">${dp}%</span>
              <span class="prob-name">เสมอ</span>
            </div>
            <div class="prob-item">
              <span class="prob-dot" style="background:#ff6b6b"></span>
              <span class="prob-pct" style="color:#ff6b6b">${aw}%</span>
              <span class="prob-name">${p.away}</span>
            </div>
          </div>
        </div>

        <div class="card-foot">
          <div class="analysis">${p.analysis}</div>
        </div>
      </div>`;
    }).join('');

  } catch(e) {
    container.innerHTML = `<div class="state">โหลดข้อมูลไม่ได้<br><small style="font-size:11px;margin-top:8px;display:block">${e.message}</small></div>`;
  }
}

load();
</script>
</body>
</html>
