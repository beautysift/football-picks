name: Daily Football Picks

on:
  schedule:
    - cron: '0 1 * * *'  # 08:00 Thailand time (UTC+7)
  workflow_dispatch:      # รันมือได้ด้วย

jobs:
  generate-picks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run analyzer
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_GROUP_ID: ${{ secrets.MINIMAX_GROUP_ID }}
        run: python main.py

      - name: Commit picks
        run: |
          git config user.name "StreetPick Bot"
          git config user.email "bot@streetpick.com"
          git add web/picks.json
          git diff --staged --quiet || git commit -m "picks: $(date +'%Y-%m-%d')"
          git push
